{{/* Ko-fi floating widget. Safe to include more than once: it only loads one time per page. */}}
<script>
  (function () {
    if (window.__kofiWidgetLoaded) return;
    window.__kofiWidgetLoaded = true;

    function draw() {
      kofiWidgetOverlay.draw('beyondthejoystick', {
        'type': 'floating-chat',
        'floating-chat.donateButton.text': 'Support me',
        'floating-chat.donateButton.background-color': '#F0B44D',
        'floating-chat.donateButton.text-color': '#0B1220'
      });
    }

    var s = document.createElement('script');
    s.src = 'https://storage.ko-fi.com/cdn/scripts/overlay-widget.js';
    s.onload = function () {
      if (document.body) { draw(); }
      else { document.addEventListener('DOMContentLoaded', draw); }
    };
    document.head.appendChild(s);
  })();
</script>
