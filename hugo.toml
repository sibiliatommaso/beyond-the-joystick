# Absolute production URL: needed for canonical links, sitemap, social images and structured data.
# `hugo server` still serves on localhost while you work.
baseURL = 'https://beyondthejoystick.space/'
locale = 'en-us'
title = 'Beyond the Joystick'
# NOTE: `theme = 'PaperMod'` is intentionally removed.
 
[params]
  authorName = 'Tommaso Sibilia'
  description = 'Explore planetary robotics, autonomous navigation, SLAM, ROS 2, and practical engineering projects for autonomous rovers.'
  # Hero image (existing file). Confirm source and credit before publishing.
  heroImage = '/wp-content/uploads/2025/11/perseverance-selfie.webp'
  # Leave empty until the real Ko-fi URL is verified; the support buttons stay hidden.
  kofiURL = 'https://ko-fi.com/L4L31PCL3I'
  homeRoverImage = '/images/rover-preview.png'
 
[markup.goldmark.renderer]
  unsafe = true

[permalinks]
  posts = "/:slug/"
  labs = "/:slug/"

  [services]
  [services.googleAnalytics]
    id = 'G-V55NX8DX4V'

# Syntax highlighting for fenced code blocks (```python ... ```)
[markup.highlight]
  style = 'github-dark'
  noClasses = true
  tabWidth = 4
 
[[menus.main]]
  name = 'Home'
  url = '/'
  weight = 1
[[menus.main]]
  name = 'Articles'
  url = '/posts/'
  weight = 2
[[menus.main]]
  name = 'Labs & Projects'
  url = '/labs/'
  weight = 3
[[menus.main]]
  name = 'About'
  url = '/about/'
  weight = 4
 
